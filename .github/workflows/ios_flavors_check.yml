name: iOS flavor check

on:
  workflow_dispatch:

jobs:
  build-ios-flavors:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: production
            target: lib/main_production.dart
          - flavor: development
            target: lib/main_development.dart
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --flavor ${{ matrix.flavor }} --no-codesign -t ${{ matrix.target }}